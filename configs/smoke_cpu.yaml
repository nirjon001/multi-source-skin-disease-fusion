# CPU smoke test — proves the pipeline runs end-to-end before the lab run.
# Uses a distinct run_id so results/phase1_baseline.json is never written
# by a garbage 2-epoch run. Delete artifacts after it passes.
# Usage: py -3.11 src/train_resumable.py --config configs/smoke_cpu.yaml --profile home_rx580_cpu --epochs 2

data_root: F:/Downloads/skin_disease_images
model: efficientnet_b0
epochs: 2
batch_size: 8
img_size: 224
lr: 0.001
weight_decay: 0.0001
seed: 42
num_workers: 2
run_id: smoke_test
results_dir: F:/cse475_skin/results
logs_dir: F:/cse475_skin/logs